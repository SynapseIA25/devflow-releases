[package]
name = "mimo-agent"
version = "0.8.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mimo_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"   # auto-actualización firmada contra los Releases de GitHub
tauri-plugin-process = "2"   # relaunch de la app tras instalar el update
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
rfd = "0.15"
# rustls en vez de la TLS del sistema → compila igual en Windows/Linux/Mac sin openssl del SO.
# "blocking": el puente de eventos SSE de OpenCode (opencode_events_start) lee /event en un hilo
# aparte con el cliente bloqueante, mismo idiom que el resto del archivo (BufReader sobre stdout de
# procesos hijo) — WebView2 no entrega bien un fetch()/EventSource de streaming (verificado
# empíricamente: solo llega el primer evento), así que el streaming real lo hace Rust, no el webview.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "charset", "http2", "blocking"] }
tiny_http = "0.12"   # servidor HTTP mínimo para el trigger webhook
notify = "6"         # watcher de filesystem para el trigger on-file-change
# tokio ya vive transitivamente vía tauri (que lo usa como runtime async) — se declara directo acá
# para poder spawnear tareas concurrentes reales en http_load_test (nodo perf, modo HTTP) sin
# orquestar la concurrencia desde el webview (evita N round-trips de IPC Tauri por request).
tokio = { version = "1", features = ["full"] }

